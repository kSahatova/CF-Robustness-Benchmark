experiment_name: 'coin_cfe'

# configure the dataset 
data: {
  name : "fmnist",
  class_name : 'FashionMNISTDataset',
  classes: [0, 4],
  num_classes: 2,
  img_size: 28,
  download: True,
  undersample_flag: False, # if the dataset is unbalanced, set to True to undersample the majority class in binary setting
  channels_first: True, # if True, the input tensor is in (C, H, W) format, otherwise (H, W, C)
  increase_channels: False # increase channels to 3 
}

data_dir :  "/data/leuven/365/vsc36567/CF-Robustness-Benchmark/data"
#"D:/PycharmProjects/CF-Robustness-Benchmark/data"
classifier:
  name: "SimpleCNNtorch" # a class name of the predictive model to use
  args:
    input_channels: 1 # number of input channels
    in_conv_channels: [1, 8, 16] 
    out_conv_channels: [8, 16, 32]
    conv_kernels: [7, 5, 3]
    softmax_flag: True
  lightning_used: True
  # path to the checkpoints
  checkpoints_path: "/data/leuven/365/vsc36567/CF-Robustness-Benchmark/notebooks/experiments/fmnist_classification/binary/checkpoints/fmnist_0_4_epoch=06_val_accuracy=0.99.pth"
  # "D:/PycharmProjects/CF-Robustness-Benchmark/notebooks/experiments/fmnist_classification/binary/checkpoints/fmnist_0_4_epoch=06_val_accuracy=0.99.pth"
lightning_used: True
#'D:/PycharmProjects/CF-Robustness-Benchmark/notebooks/experiments/derma_classification/binary/checkpoints/derma_epoch=08_train_accuracy=0.97.pth'
logging_dir: '/data/leuven/365/vsc36567/CF-Robustness-Benchmark/cf_output/fmnist'
# 'D:/PycharmProjects/CF-Robustness-Benchmark/cf_output/derma'

explain_class_idx: 1
num_bins: 2 # number of bins for discritization of the classifier's predictions
in_channels: 1

# Encoder's parameters
enc_params: 
  downsample_scales: [2, 2, 2]
  out_channels: [64, 128, 256]
  use_snconv: false

# Generator's parameters
gen_params: 
  upsample_scales: [2, 2, 2]
  out_channels: [256, 128, 64]
  upsample_kind: bilinear
  use_snconv: false
  # indices are specifided w.r.t bottleneck (index=0) and upwards
  skip_conn: [1, 2]


gen_update_freq: 4

# Discriminator's parameters
disc_params:
  downsample_scales: [2, 2, 1]
  out_channels: [64, 128, 256]

# Optimizers' parameters
lr: 0.0002
b1: 0.0
b2: 0.999

# Loss functions' hyperparameters
ptb_based: True # perturbation based generator
cyclic_rec: True 
adv_loss: 'mse'
rec_kind: 'l1'
lambda_adv: 1.0
lambda_kl: 1.0
lambda_rec: 1.0
lambda_minc: 1.0
lambda_tv: 0.05

eps: 1.0e-8
batch_size: 5
n_epochs: 10
sample_interval: 100
precision: '32'
seed: 2025
eval_counter_freq : 5
checkpoint_freq: 10
log_visualizations: false

num_workers: 1
accelerator: "cuda"
devices: 1 # number of devices to use
save_dir: "/data/leuven/365/vsc36567/CF-Robustness-Benchmark/cf_output/fmnist/coin_binary" 


